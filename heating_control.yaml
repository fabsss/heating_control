blueprint:
  name: Heizungssteuerung (V4.30)
  description: >
    Steuert die Heizung basierend auf dem Anwesenheitsstatus. Priorisiert manuelle Eingriffe und behandelt Sonderfälle wie Gäste- und Urlaubsmodus.

    Der Zeitplan (Schedule-Helper) kann je Block ein Preset über die "Additional data" wählen: "preset: eco", "preset: home_low" oder "preset: comfort".
    Ohne Angabe gilt ein aktiver Block als Komfort, ist der Zeitplan aus, gilt Eco.

    ⚠️ WICHTIGER HINWEIS: Wenn "Scheduler aktivieren" = true, muss auch eine "Zeitplan" Entity konfiguriert werden!
  domain: automation
  source_url: https://github.com/fabsss/heating_control/blob/main/heating_control.yaml
  input:
    heating_entities:
      name: Heizkörper
      description: Der zu steuernde Heizkörperthermostat.
      selector:
        entity:
          domain: climate
          multiple: false
    flat_occupation_state:
      name: Anwesenheitsstatus
      description: Input Select, der den Status der Wohnung abbildet (z.B. Home, Away, Sleep).
      selector:
        entity:
          domain: input_select
    heating_on_off:
      name: (Optional) Heizung An/Aus (Winter-Modus)
      description: Optional - Input Boolean, der die Heizungssteuerung global aktiviert oder deaktiviert. Wenn nicht gesetzt, ist die Heizung immer aktiv.
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: false
    eco_preset:
      name: (Optional) Eco-Preset
      description: >
        Preset der Climate-Entität (z.B. von Better Thermostat) für "Eco" (Basis-Zustand: Zeitplan aus, nächtlicher Reset).
        Hat Vorrang vor der Eco-Temperatur. Die Auswahlliste zeigt gängige Namen; eigene Preset-Namen können frei
        eingegeben werden (exakt wie im Attribut "preset_modes" der Entität). Bietet die Entität das Preset nicht an,
        wird die Eco-Temperatur verwendet.
      default: "__none__"
      selector:
        select:
          custom_value: true
          options:
            - label: "Kein Preset – Eco-Temperatur verwenden"
              value: "__none__"
            - label: "Eco"
              value: "eco"
            - label: "Away"
              value: "away"
            - label: "Sleep"
              value: "sleep"
            - label: "Home"
              value: "home"
            - label: "Comfort"
              value: "comfort"
            - label: "Boost"
              value: "boost"
            - label: "Activity"
              value: "activity"
    comfort_preset:
      name: (Optional) Komfort-Preset
      description: >
        Preset der Climate-Entität (z.B. von Better Thermostat) für "Komfort". Hat Vorrang vor der Komfort-Temperatur.
        Eigene Preset-Namen können frei eingegeben werden. Bietet die Entität das Preset nicht an, wird die
        Komfort-Temperatur verwendet.
      default: "__none__"
      selector:
        select:
          custom_value: true
          options:
            - label: "Kein Preset – Komfort-Temperatur verwenden"
              value: "__none__"
            - label: "Comfort"
              value: "comfort"
            - label: "Eco"
              value: "eco"
            - label: "Home"
              value: "home"
            - label: "Away"
              value: "away"
            - label: "Sleep"
              value: "sleep"
            - label: "Boost"
              value: "boost"
            - label: "Activity"
              value: "activity"
    home_low_preset:
      name: (Optional) Home-Low-Preset (Tagesabsenkung)
      description: >
        Preset der Climate-Entität für "Home Low" (zuhause, aber kühler als Eco). Wird von Zeitplan-Blöcken mit
        "preset: home_low" verwendet. Bietet die Entität das Preset nicht an, wird die Home-Low-Temperatur verwendet.
      default: "__none__"
      selector:
        select:
          custom_value: true
          options:
            - label: "Kein Preset – Home-Low-Temperatur verwenden"
              value: "__none__"
            - label: "Home"
              value: "home"
            - label: "Away"
              value: "away"
            - label: "Eco"
              value: "eco"
            - label: "Comfort"
              value: "comfort"
            - label: "Sleep"
              value: "sleep"
            - label: "Boost"
              value: "boost"
            - label: "Activity"
              value: "activity"
    sleep_preset:
      name: (Optional) Sleep-Preset
      description: >
        Preset der Climate-Entität für den Wohnungszustand "Sleep". Ohne Angabe verhält sich Sleep wie bisher
        (Eco-Preset bzw. Eco-Temperatur). Bietet die Entität das Preset nicht an, wird die Sleep-Temperatur
        (bzw. die Eco-Temperatur) verwendet.
      default: "__none__"
      selector:
        select:
          custom_value: true
          options:
            - label: "Kein Preset – wie Eco"
              value: "__none__"
            - label: "Sleep"
              value: "sleep"
            - label: "Eco"
              value: "eco"
            - label: "Home"
              value: "home"
            - label: "Away"
              value: "away"
            - label: "Comfort"
              value: "comfort"
            - label: "Boost"
              value: "boost"
            - label: "Activity"
              value: "activity"
    eco_temperature:
      name: Eco-Temperatur
      description: Fallback-Temperatur in °C für "Eco" (Basis-Zustand, nächtlicher Reset), wenn kein Eco-Preset gewählt/verfügbar ist.
      default: 17.0
      selector:
        number:
          min: 5
          max: 25
          unit_of_measurement: "°C"
          step: 0.5
    comfort_temperature:
      name: Komfort-Temperatur
      description: Fallback-Temperatur in °C, die vom Scheduler gesetzt wird, wenn kein Komfort-Preset gewählt/verfügbar ist.
      default: 21.0
      selector:
        number:
          min: 15
          max: 30
          unit_of_measurement: "°C"
          step: 0.5
    home_low_temperature:
      name: Home-Low-Temperatur
      description: Fallback-Temperatur in °C für "Home Low" (Tagesabsenkung), wenn kein Home-Low-Preset gewählt/verfügbar ist.
      default: 16.0
      selector:
        number:
          min: 5
          max: 25
          unit_of_measurement: "°C"
          step: 0.5
    sleep_temperature:
      name: Sleep-Temperatur
      description: Fallback-Temperatur in °C für "Sleep", wenn kein Sleep-Preset gewählt/verfügbar ist. 0 = Eco-Temperatur verwenden.
      default: 0
      selector:
        number:
          min: 0
          max: 25
          unit_of_measurement: "°C"
          step: 0.5

    # Optionaler Scheduler
    scheduler_enabled:
      name: Scheduler aktivieren
      description: Wenn aktiviert, wird der Zeitplan verwendet (Komfort, oder per "preset" im Block Eco/Home Low).
      default: false
      selector:
        boolean: {}
    scheduler_toggle:
      name: (Optional) Scheduler Ein/Aus Toggle
      description: Optional - Input Boolean zur Laufzeit-Steuerung des Schedulers. Hat Vorrang vor "Scheduler aktivieren".
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: false
    schedule_entity:
      name: (Optional) Zeitplan
      description: >
        Schedule-Helper für die Zeiten. Pro Block kann unter "Additional data" mit "preset: comfort", "preset: eco"
        oder "preset: home_low" die Stufe gewählt werden (ohne Angabe: Komfort).
        WICHTIG: Wird benötigt wenn "Scheduler aktivieren" = true ist oder eine Scheduler Toggle-Variable übergeben wird.
      default: []
      selector:
        entity:
          domain: schedule
          multiple: false
    office_day_eco_override:
      name: (Optional) Office-Modus (Scheduler deaktiviert)
      description: Optional - Binary Sensor, welche aktiv ist wenn an einem Arbeitstag im Büro gearbeitet wird. In diesem Fall wird der Scheduler ignoriert.
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: false
    hold_timer:
      name: (Optional) Hold-Timer (manuelle Änderung)
      description: >
        Optional - Timer-Helper für diesen Raum. Wird bei einer manuellen Änderung am Heizkörper gestartet;
        solange er läuft, werden Zeitplan-Wechsel nicht angewendet. Der Hold endet beim Ablauf (dann gilt wieder
        der Zeitplan), bei Sleep, beim nächtlichen Reset und beim Einschalten von Scheduler-Toggle oder Winter-Modus.
        Ohne Timer gibt es keinen Hold.
      default: []
      selector:
        entity:
          domain: timer
          multiple: false
    hold_duration_helper:
      name: (Optional) Hold-Dauer in Minuten
      description: Optional - Input Number mit der Dauer des Holds in Minuten (gemeinsam für alle Räume). Ohne Angabe 180 Minuten.
      default: []
      selector:
        entity:
          domain: input_number
          multiple: false
    ki_rules_toggle:
      name: (Optional) KI-Regeln erlaubt (Schalter)
      description: >
        Optional - Input Boolean, der die selbstlernenden KI-Regeln für diesen Heizkörper erlaubt (an) oder in den
        Schattenmodus zwingt (aus). Diese Automation wertet den Schalter nicht aus; er ordnet dem Heizkörper
        seinen KI-Schalter zu und wird vom Programm "execution deploy" gelesen.
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: false

    # Optionaler täglicher Reset
    nightly_eco_time:
      name: Zeit für den nächtlichen Reset
      description: >
        Die Uhrzeit, zu der in jedem Wohnungszustand der Standardzustand gesetzt wird (Sleep: Sleep-Preset, sonst
        Zeitplan-Stufe bzw. Eco) und ein laufender Hold endet. Der Heizmodus wird je nach Wohnungszustand
        auf "heat" oder "off" gesetzt.
      default: "01:00:00"
      selector:
        time: {}

# Wir verwenden den 'queued' Modus für saubere Ausführung
mode: queued
max: 20
max_exceeded: silent

# Trigger-Variablen: Ermöglicht Template-Triggern den Zugriff auf Blueprint-Inputs
trigger_variables:
  heating_on_off: !input heating_on_off
  scheduler_enabled: !input scheduler_enabled
  schedule_entity: !input schedule_entity
  scheduler_toggle: !input scheduler_toggle
  # Für Template-basierte Zeit-Trigger
  nightly_eco_time: !input nightly_eco_time

variables:
  # Eingänge für einfacheren Zugriff
  heating_entities: !input heating_entities
  flat_occupation_state: !input flat_occupation_state
  heating_on_off: !input heating_on_off
  scheduler_enabled: !input scheduler_enabled
  scheduler_toggle: !input scheduler_toggle
  office_day_eco_override: !input office_day_eco_override
  schedule_entity: !input schedule_entity
  eco_preset: !input eco_preset
  comfort_preset: !input comfort_preset
  home_low_preset: !input home_low_preset
  sleep_preset: !input sleep_preset
  eco_temperature: !input eco_temperature
  comfort_temperature: !input comfort_temperature
  home_low_temperature: !input home_low_temperature
  sleep_temperature: !input sleep_temperature
  hold_timer: !input hold_timer
  hold_duration_helper: !input hold_duration_helper

  # Rollen: eco (Basis), comfort, home_low (Tagesabsenkung), sleep.
  # Ein Preset wird nur genutzt, wenn eines gewählt ist UND die Climate-Entität es anbietet
  # (Groß-/Kleinschreibung egal; verwendet wird der echte Name aus "preset_modes").
  # Sonst "" -> Fallback auf die feste Temperatur der Rolle.
  # Sleep ohne eigenes Preset nutzt das Eco-Preset (Verhalten wie vor V4.30).
  role_presets: >-
    {%- set modes = state_attr(heating_entities, "preset_modes") or [] -%}
    {%- set sleep_want = sleep_preset if sleep_preset not in ["", "__none__"] else eco_preset -%}
    {%- set want = [["eco", eco_preset], ["comfort", comfort_preset], ["home_low", home_low_preset], ["sleep", sleep_want]] -%}
    {%- set ns = namespace(items=[], found="") -%}
    {%- for role, w in want -%}
      {%- set ns.found = "" -%}
      {%- if w not in ["", "__none__"] -%}
        {%- for p in modes -%}
          {%- if p | lower == w | lower -%}{%- set ns.found = p -%}{%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {%- set ns.items = ns.items + [[role, ns.found]] -%}
    {%- endfor -%}
    {{- dict(ns.items) -}}
  role_temps: >-
    {{ {
      "eco": eco_temperature | float(17),
      "comfort": comfort_temperature | float(21),
      "home_low": home_low_temperature | float(16),
      "sleep": (sleep_temperature | float(0)) if (sleep_temperature | float(0)) > 0 else (eco_temperature | float(17))
    } }}

  # Logik-Variablen
  is_heating_season: "{{ (heating_on_off != [] and states(heating_on_off) == 'on') or heating_on_off == [] }}"
  # Nur prüfen, wenn eine Schedule-Entity gesetzt ist
  is_scheduler_active: "{{ schedule_entity != [] and is_state(schedule_entity, 'on') }}" # Scheduler in "on"-Zustand
  # Scheduler-Logik: input_boolean hat Vorrang vor statischer scheduler_enabled Variable
  is_scheduler_enabled: >
    {{
      (
        (scheduler_toggle != [] and states(scheduler_toggle) == 'on') or
        (scheduler_toggle == [] and scheduler_enabled)
      ) and
      (office_day_eco_override == [] or states(office_day_eco_override) == 'off')
    }}
  # Jeder Zustand außer Away/Vacation (dort ist die Heizung bereits aus) und unavailable/unknown zählt als "war zuhause"
  was_home_before: "{{ trigger is defined and trigger.from_state is defined and trigger.from_state is not none and trigger.from_state.state not in ['Away', 'Vacation', 'unavailable', 'unknown'] }}"
  heating_blocked: "{{ not is_heating_season or is_state(flat_occupation_state, 'Vacation') }}"
  in_sleep: "{{ is_state(flat_occupation_state, 'Sleep') }}"
  hold_active: "{{ hold_timer != [] and is_state(hold_timer, 'active') }}"
  hold_minutes: "{{ (states(hold_duration_helper) | float(180)) | int if hold_duration_helper != [] else 180 }}"

  # Rolle des aktuellen Zeitplan-Blocks. Das Attribut "preset" kommt aus "Additional data" des aktiven Blocks
  # (nur bei aktivem Block vorhanden). Immer live gelesen, nicht aus dem Trigger.
  schedule_role_raw: >-
    {{ ((state_attr(schedule_entity, 'preset') or '') | string | trim | lower) if schedule_entity != [] else '' }}
  schedule_role: >-
    {%- if not (is_scheduler_enabled and is_scheduler_active) -%}eco
    {%- elif schedule_role_raw in ['eco', 'home_low'] -%}{{ schedule_role_raw }}
    {%- else -%}comfort
    {%- endif -%}
  # Zielrolle: Sleep hat Vorrang vor dem Zeitplan
  target_role: "{{ 'sleep' if in_sleep else schedule_role }}"

  # Zeitplan-Trigger: nur bei echtem Wechsel der Rolle schreiben (Block-Grenze mit gleicher Rolle, unavailable usw. ignorieren)
  schedule_role_before: >-
    {%- if trigger is defined and trigger.id == 'schedule_change' and trigger.from_state is not none and trigger.from_state.state in ['on', 'off'] -%}
      {%- if trigger.from_state.state == 'on' -%}
        {%- set r = (trigger.from_state.attributes.get('preset') or '') | string | trim | lower -%}
        {{- r if r in ['eco', 'home_low'] else 'comfort' -}}
      {%- else -%}eco{%- endif -%}
    {%- endif -%}
  schedule_role_after: >-
    {%- if trigger is defined and trigger.id == 'schedule_change' and trigger.to_state is not none and trigger.to_state.state in ['on', 'off'] -%}
      {%- if trigger.to_state.state == 'on' -%}
        {%- set r = (trigger.to_state.attributes.get('preset') or '') | string | trim | lower -%}
        {{- r if r in ['eco', 'home_low'] else 'comfort' -}}
      {%- else -%}eco{%- endif -%}
    {%- endif -%}
  schedule_role_changed: "{{ schedule_role_before != '' and schedule_role_after != '' and schedule_role_before != schedule_role_after }}"
  # Unbekannter Wert im Attribut "preset" des aktiven Blocks
  schedule_attr_invalid: "{{ is_scheduler_active and schedule_role_raw not in ['', 'comfort', 'eco', 'home_low'] }}"

  # Sleep betreten / verlassen
  entering_sleep: "{{ trigger is defined and trigger.id == 'occupation_change' and in_sleep and (trigger.from_state is none or trigger.from_state.state != 'Sleep') }}"
  leaving_sleep: "{{ trigger is defined and trigger.id == 'occupation_change' and trigger.from_state is not none and trigger.from_state.state == 'Sleep' and trigger.to_state is not none and trigger.to_state.state not in ['Sleep', 'unavailable', 'unknown'] }}"

  # Soll die Zielrolle geschrieben werden?
  # - Sleep verlassen: immer (auch bei Away/Vacation/Winter-Modus aus), damit das Sleep-Preset nicht stehen bleibt
  # - sonst nur bei aktiver Heizung: Sleep betreten, nächtlicher Reset, Toggle/Winter-Modus, Hold-Ende, Zeitplan-Wechsel
  apply_role: >-
    {{ leaving_sleep or (not heating_blocked and (
         entering_sleep
         or trigger.id == 'nightly_eco_time_trigger'
         or (trigger.id in ['scheduler_toggle_change', 'heating_toggle'] and is_scheduler_enabled and not in_sleep)
         or (trigger.id == 'hold_finished' and is_scheduler_enabled and not in_sleep)
         or (trigger.id == 'schedule_change' and is_scheduler_enabled and not in_sleep and not hold_active and schedule_role_changed)
       )) }}
  # Hold beenden: Sleep, nächtlicher Reset, Einschalten von Scheduler-Toggle bzw. Winter-Modus
  cancel_hold: >-
    {{ hold_active and (
         entering_sleep or leaving_sleep
         or trigger.id == 'nightly_eco_time_trigger'
         or (trigger.id in ['scheduler_toggle_change', 'heating_toggle'] and is_scheduler_enabled and not heating_blocked)
       ) }}
  # Manuelle Änderung: weicht der neue Wert vom Soll der aktuellen Rolle ab?
  manual_deviates: >-
    {%- if trigger is defined and trigger.id == 'manual_change' and trigger.to_state is not none -%}
      {%- set a = trigger.to_state.attributes -%}
      {%- set want = role_presets[target_role] -%}
      {%- if want != '' -%}
        {{- (a.get('preset_mode') or '') | lower != want | lower -}}
      {%- else -%}
        {{- ((a.get('temperature') | float(0)) - (role_temps[target_role] | float(0))) | abs > 0.01 -}}
      {%- endif -%}
    {%- else -%}false{%- endif -%}


# Trigger: Löst bei jeder relevanten Änderung aus
trigger:
  - platform: state
    entity_id: !input flat_occupation_state
    id: "occupation_change"
  # Template-Trigger für optionale Entities (mit trigger_variables Zugriff)
  - platform: template
    value_template: "{{ heating_on_off != [] and is_state(heating_on_off, 'on') }}"
    id: "heating_toggle"
  - platform: template
    value_template: "{{ heating_on_off != [] and is_state(heating_on_off, 'off') }}"
    id: "heating_toggle"
  # Zeitplan: State-Trigger ohne to/from, damit auch Wechsel zwischen aneinandergrenzenden Blöcken
  # (nur das Attribut "preset" ändert sich, State bleibt "on") auslösen.
  # Ob sich die Rolle wirklich geändert hat, prüft die Variable schedule_role_changed.
  - platform: state
    entity_id: !input schedule_entity
    id: "schedule_change"
  - platform: template
    value_template: "{{ scheduler_toggle != [] and is_state(scheduler_toggle, 'on') }}"
    id: "scheduler_toggle_change"
  - platform: template
    value_template: "{{ scheduler_toggle != [] and is_state(scheduler_toggle, 'off') }}"
    id: "scheduler_toggle_change"
  - platform: time
    at: !input nightly_eco_time
    id: "nightly_eco_time_trigger"
  # Redundanter Template-Trigger: feuert exakt zur täglichen Uhrzeit (lokal)
  # Hinweis: now() wird minütlich aktualisiert; Vergleich inkl. Sekunden ist ok,
  # da das Update zum Sekundenwechsel :00 erfolgt.
  - platform: template
    value_template: >-
      {{ now().strftime('%H:%M:%S') == (nightly_eco_time | string) }}
    id: "nightly_eco_time_trigger"
  # Manuelle Änderungen am Heizkörper (für den Hold)
  - platform: state
    entity_id: !input heating_entities
    attribute: preset_mode
    id: "manual_change"
  - platform: state
    entity_id: !input heating_entities
    attribute: temperature
    id: "manual_change"
  # Hold abgelaufen (nur bei natürlichem Ablauf, nicht bei Abbruch)
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input hold_timer
    id: "hold_finished"

action:
  # --- HOLD-ERKENNUNG: manuelle Änderung startet den Hold-Timer ---
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'manual_change' }}"
    then:
      - if:
          - condition: template
            value_template: >-
              {{ hold_timer != [] and is_scheduler_enabled and not heating_blocked and not in_sleep
                 and trigger.from_state is not none
                 and trigger.from_state.state not in ['unavailable', 'unknown']
                 and trigger.to_state is not none
                 and trigger.to_state.state not in ['unavailable', 'unknown']
                 and trigger.to_state.context.parent_id is none
                 and manual_deviates }}
        then:
          - service: timer.start
            continue_on_error: true
            target:
              entity_id: "{{ hold_timer }}"
            data:
              duration: "{{ hold_minutes * 60 }}"
      - stop: "Hold-Erkennung abgeschlossen"

  # Validierung: Scheduler aktiviert aber keine Schedule Entity gesetzt
  - if:
      - condition: template
        value_template: "{{ (scheduler_enabled or scheduler_toggle != []) and schedule_entity == [] }}"
    then:
      - service: persistent_notification.create
        data:
          title: "❌ Heizungssteuerung Konfigurationsfehler"
          message: >
            Die Automation "{{ this.attributes.friendly_name }}" ist fehlerhaft konfiguriert:

            - "Scheduler aktivieren" ist auf TRUE gesetzt oder ein "Scheduler Ein/Aus Toggle" ist gewählt
            - Aber "Zeitplan" Entity ist nicht konfiguriert

            Der Scheduler wird ohne Zeitplan nicht ausgewertet, die übrige Steuerung läuft weiter.
            Bitte korrigieren Sie die Automation-Konfiguration!
          notification_id: "heating_control_config_error_{{ this.entity_id | replace('.', '_') }}"

  # Hinweis, wenn ein gewähltes Preset von der Entität nicht angeboten wird (Fallback auf Temperatur)
  - if:
      - condition: template
        value_template: >-
          {{ state_attr(heating_entities, 'preset_modes') is not none and (
               (eco_preset not in ['', '__none__'] and role_presets['eco'] == '') or
               (comfort_preset not in ['', '__none__'] and role_presets['comfort'] == '') or
               (home_low_preset not in ['', '__none__'] and role_presets['home_low'] == '') or
               (sleep_preset not in ['', '__none__'] and role_presets['sleep'] == '')) }}
    then:
      - service: persistent_notification.create
        continue_on_error: true
        data:
          title: "⚠️ Heizungssteuerung: Preset nicht verfügbar"
          message: >
            Die Automation "{{ this.attributes.friendly_name }}" nutzt ein Preset, das
            "{{ heating_entities }}" nicht anbietet. Es wird stattdessen die feste Temperatur verwendet.

            - Eco-Preset: "{{ eco_preset }}"
            - Komfort-Preset: "{{ comfort_preset }}"
            - Home-Low-Preset: "{{ home_low_preset }}"
            - Sleep-Preset: "{{ sleep_preset }}"
            - Verfügbar: {{ state_attr(heating_entities, 'preset_modes') | join(', ') }}
          notification_id: "heating_control_preset_missing_{{ this.entity_id | replace('.', '_') }}"

  # Hinweis, wenn der Zeitplan-Block einen unbekannten Wert in "preset" hat (es gilt Komfort)
  - if:
      - condition: template
        value_template: "{{ schedule_attr_invalid }}"
    then:
      - service: persistent_notification.create
        continue_on_error: true
        data:
          title: "⚠️ Heizungssteuerung: Unbekanntes Zeitplan-Preset"
          message: >
            Der aktive Block von "{{ schedule_entity }}" hat unter "Additional data" den Wert
            "preset: {{ schedule_role_raw }}". Erlaubt sind: comfort, eco, home_low.
            Für "{{ this.attributes.friendly_name }}" gilt Komfort.
          notification_id: "heating_control_schedule_preset_{{ this.entity_id | replace('.', '_') }}"

  # --- HOLD BEENDEN (Sleep, nächtlicher Reset, Einschalten von Toggle/Winter-Modus) ---
  - if:
      - condition: template
        value_template: "{{ cancel_hold }}"
    then:
      - service: timer.cancel
        continue_on_error: true
        target:
          entity_id: "{{ hold_timer }}"

  # --- ZIELROLLE SCHREIBEN (Preset oder Temperatur) ---
  - if:
      - condition: template
        value_template: "{{ apply_role }}"
    then:
      - variables:
          apply_preset: "{{ role_presets[target_role] }}"
          apply_use_preset: "{{ apply_preset != '' }}"
          apply_temperature: "{{ role_temps[target_role] }}"
          # Smart Temperature Setting: Nur beim Temperatur-Fallback muss der Thermostat eingeschaltet sein.
          # Presets können auch im Zustand "off" gesetzt werden und gelten ab dem Einschalten.
          current_hvac_mode: "{{ state_attr(heating_entities, 'hvac_mode') or states(heating_entities) }}"
          need_temp_restore: "{{ current_hvac_mode == 'off' and not apply_use_preset }}"
      - if:
          - condition: template
            value_template: "{{ need_temp_restore }}"
        then:
          # Temporär einschalten für Temperatur-Setting
          - service: climate.set_hvac_mode
            continue_on_error: true
            target:
              entity_id: !input heating_entities
            data:
              hvac_mode: heat
          - wait_template: "{{ states(heating_entities) != 'off' }}"
            timeout: "00:00:10"
            continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ apply_use_preset }}"
        then:
          - service: climate.set_preset_mode
            continue_on_error: true
            target:
              entity_id: !input heating_entities
            data:
              preset_mode: "{{ apply_preset }}"
        else:
          - service: climate.set_temperature
            continue_on_error: true
            target:
              entity_id: !input heating_entities
            data:
              temperature: "{{ apply_temperature }}"
      # Falls ursprünglich aus, wieder ausschalten
      - if:
          - condition: template
            value_template: "{{ need_temp_restore }}"
        then:
          - service: climate.set_hvac_mode
            continue_on_error: true
            target:
              entity_id: !input heating_entities
            data:
              hvac_mode: "{{ current_hvac_mode }}"

  # --- HEIZMODUS-LOGIK ---
  - choose:
      # --- HÖCHSTE PRIORITÄT: HEIZUNG AUS ---
      - conditions:
          - condition: template
            value_template: >-
              {{ not is_heating_season or is_state(flat_occupation_state, 'Vacation') }}
        sequence:
          - service: climate.turn_off
            continue_on_error: true
            target:
              entity_id: !input heating_entities

      # --- ZWEITE PRIORITÄT: Heizung ausschalten beim Verlassen  ---
      - conditions:
          - condition: trigger
            id: "occupation_change"
          - condition: template
            value_template: "{{ was_home_before }}"
          - condition: state
            entity_id: !input flat_occupation_state
            state:
              - "Away"
        sequence:
          - service: climate.set_hvac_mode
            continue_on_error: true
            target:
              entity_id: !input heating_entities
            data:
              hvac_mode: "off" # war: heat - Schaltet Heizung aus, wenn weg

      # --- NÄCHTLICHER RESET: Heizmodus je nach Wohnungszustand (die Zielrolle wurde oben geschrieben) ---
      - conditions:
          - condition: trigger
            id: "nightly_eco_time_trigger"
        sequence:
          # Wiederherstellen des Heizmodus, wenn Anwesenheitsstatus "Home" ist (sonst passiert das beim nach Hause kommen)
          - if:
            - condition: state
              entity_id: !input flat_occupation_state
              state:
                - "Home"
                - "Guest Mode"
                - "Sleep"
                - "Leaving"
                - "Coming Home"
            then:
              - service: climate.set_hvac_mode
                continue_on_error: true
                target:
                  entity_id: !input heating_entities
                data:
                  hvac_mode: heat
            else:
              - service: climate.set_hvac_mode
                continue_on_error: true
                target:
                  entity_id: !input heating_entities
                data:
                  hvac_mode: "off"

      # --- ZUSTAND WIEDERHERSTELLEN BEI ANKUNFT (NUR NACH AWAY UND WENN SZENE EXISTIERT) ---
      - conditions:
          - condition: trigger
            id: "occupation_change"
          - condition: state
            entity_id: !input flat_occupation_state
            state:
              - "Coming Home"
              - "Home"
          - condition: template
            value_template: "{{ trigger.from_state.state in ['Away', 'Vacation'] }}"
        sequence:
          - service: climate.set_hvac_mode
            continue_on_error: true
            target:
              entity_id: !input heating_entities
            data:
              hvac_mode: heat
