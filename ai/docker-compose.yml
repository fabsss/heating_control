services:
  collector:
    build: .
    container_name: home-ai-collector
    restart: unless-stopped
    env_file: .env
    environment:
      COLLECTOR_CONFIG: /config/collector.yaml
      HEALTH_FILE: /tmp/collector.health
      TZ: Europe/Berlin
    volumes:
      - /mnt/data/nobackup/homeassistant/ai:/data
      - /mnt/data/backup/databases:/backup
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "python", "-m", "collector.healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
