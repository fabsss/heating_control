services:
  collector:
    build: .
    image: home-ai-collector
    container_name: home-ai-collector
    restart: unless-stopped
    environment:
      HA_TOKEN: ${HA_TOKEN:?HA_TOKEN fehlt}
      HA_URL: ${HA_URL:?HA_URL fehlt}
      # Nur für die Analyse (docker exec ... python -m analysis); der Collector startet auch ohne
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_PRICE_INPUT: ${OPENROUTER_PRICE_INPUT:-}
      OPENROUTER_PRICE_OUTPUT: ${OPENROUTER_PRICE_OUTPUT:-}
      COLLECTOR_CONFIG: /app/config/collector.yaml
      HEALTH_FILE: /tmp/collector.health
      TZ: Europe/Berlin
    volumes:
      - /mnt/data/nobackup/homeassistant/ai:/data
      - /mnt/data/backup/databases:/backup
    healthcheck:
      test: ["CMD", "python", "-m", "collector.healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
